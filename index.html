<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120d1f"><title>20$ Challenge</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%92%B5%3C/text%3E%3C/svg%3E"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#120d1f;--card:#1f1834;--card2:#2a2145;--acc:#ff8a1f;--acc2:#ffb347;--txt:#f5f1ff;--mut:#a99fc4;--ok:#3ddc84;--bad:#ff5470}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100vh;padding:14px 14px 90px;position:relative}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.5px}h1 b{color:var(--acc)}
h2{font-size:21px;margin:14px 0 8px}h3{font-size:16px;margin:10px 0 6px;color:var(--mut);font-weight:600}
p{line-height:1.45}.mut{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--card2);color:var(--txt);font-weight:700;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.96)}button:disabled{opacity:.35}
.btn-acc{background:linear-gradient(135deg,var(--acc),#ff5e3a);color:#fff}
.btn-ok{background:var(--ok);color:#06210f}.btn-bad{background:var(--bad);color:#fff}
.full{width:100%}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.wrap{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 12px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #3a3060;background:#150f26;color:var(--txt)}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{border-radius:16px;overflow:hidden;background:var(--card2);position:relative;min-height:96px;padding:12px;text-align:left}
.pack .ttl{font-weight:800;font-size:17px}.pack .cnt{font-size:12px;color:var(--mut)}.pack .em{font-size:30px}
.themes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.th{background:var(--card2);border-radius:14px;overflow:hidden;padding:0;text-align:left}
.th img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.th div{padding:6px 7px;font-size:12px;font-weight:700;line-height:1.2}
.th.done{opacity:.55}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon{padding:8px 12px;border-radius:12px;font-size:15px}
.theme-banner{text-align:center;padding:6px 0}.theme-banner .t{font-size:22px;font-weight:800}
.item-card{background:radial-gradient(circle at 50% 30%,#3a2d63,#1f1834);border-radius:22px;padding:16px;text-align:center;margin:10px 0}
.item-card img{height:150px;max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 18px #0008)}
.item-card .nm{font-size:24px;font-weight:800;margin-top:6px}.item-card .no{font-size:13px;color:var(--mut)}
.bid{font-size:44px;font-weight:900;color:var(--acc2);line-height:1}.lead{font-size:14px;color:var(--mut);min-height:18px}
.players{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pl{flex:1;min-width:92px;background:var(--card);border-radius:14px;padding:8px;text-align:center;border:2px solid transparent}
.pl.turn{border-color:var(--acc)}.pl.out{opacity:.45}.pl .n{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .m{font-size:20px;font-weight:900;color:var(--ok)}
.pl .s{font-size:11px;color:var(--mut)}
.turnbox{background:var(--card);border-radius:18px;padding:12px;margin-top:10px}
.turnbox .who{font-size:18px;font-weight:800;text-align:center;margin-bottom:8px}.turnbox .who b{color:var(--acc)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.amount{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}.amount .v{font-size:34px;font-weight:900;min-width:90px;text-align:center}
.amount button{width:52px;height:52px;padding:0;font-size:26px;border-radius:50%}
canvas.scene{width:100%;height:auto;border-radius:16px;background:#000;display:block}
.builds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.builds.one{grid-template-columns:1fr}
.build{background:var(--card);border-radius:18px;padding:8px;text-align:center;border:3px solid transparent}
.build.win{border-color:var(--acc)}.build .n{font-weight:800;margin:6px 0 2px}.build ul{text-align:left;margin:4px 0;padding-left:18px;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 8px 30px #0009;max-width:90%;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,-20px);opacity:0}}
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:40;padding:18px}
.overlay .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.spin{font-size:26px;font-weight:900;text-align:center;padding:30px 10px;min-height:120px}
.score{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #2f2650;font-weight:700}
.minis{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.minis canvas{width:84px;height:84px;border-radius:10px;flex:none}
.mini{text-align:center;font-size:11px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;background:var(--bad);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
ol.rules li{margin:6px 0;line-height:1.4}
.thumb{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px}
.art{display:flex;justify-content:center;align-items:center;min-height:150px}
.art canvas{width:150px;height:150px}
.art.small{min-height:100px}.art.small canvas{width:100px;height:100px}
.emo{line-height:1.15;filter:drop-shadow(0 8px 18px #0008);font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.th .thumb{padding:0;font-size:46px;line-height:1}

.spr{height:170px;max-width:85%;object-fit:contain;filter:drop-shadow(0 8px 18px #0008)}
.art.small .spr{height:110px}
.minis canvas{width:112px;height:auto}
.big-btn{display:grid;grid-template-columns:56px 1fr;grid-template-rows:auto auto;text-align:left;width:100%;margin-top:12px;padding:16px;border-radius:20px;align-items:center}
.big-btn span{grid-row:1/3;font-size:38px}.big-btn b{font-size:20px}.big-btn small{font-weight:500;opacity:.85;font-size:13px}
.err{background:#4a1022;border:1px solid var(--bad);border-radius:14px;padding:12px;margin:10px 0;font-weight:600;line-height:1.4}
.code{font-size:56px;font-weight:900;letter-spacing:12px;color:var(--acc2);margin:4px 0 8px}
.qr{width:190px;margin:6px auto;background:#fff;border-radius:12px;padding:6px}.qr svg{width:100%;height:auto;display:block}
.net{font-size:13px;font-weight:800;padding:6px 10px;border-radius:10px;background:#123f26;color:#9ff0c0}.net.lost,.net.dead{background:#4a1022;color:#ffb3c1}
#netbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--bad);color:#fff;text-align:center;padding:10px;font-weight:800}
#netbar button{padding:6px 12px;margin-left:8px;background:#fff;color:#000}
.pl.off{opacity:.6;border-style:dashed;border-color:#ff5470}
.chip.ro{opacity:.75;pointer-events:none}
.art canvas.itm{width:190px;height:190px;filter:drop-shadow(0 8px 18px #0008)}
.art.small canvas.itm,#fart canvas.itm{width:150px;height:150px}
canvas.scene{aspect-ratio:16/9}
.build{position:relative}.zhint{position:absolute;right:14px;top:14px;font-size:11px;background:#000a;color:#fff;border-radius:8px;padding:2px 6px;pointer-events:none}
.build .aw{margin-top:6px;padding:10px}
canvas.zoomable{cursor:zoom-in}
.zoomov{padding:0;align-items:stretch}
.zoomwrap{width:100%;height:100%;display:flex;flex-direction:column}
.zbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#120d1f}.zbar b{flex:1}
.zbox{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
.zbox canvas{width:100%;max-width:1400px;height:auto;cursor:zoom-in;display:block}
.zbox.big{display:block}.zbox.big canvas{width:260%;max-width:none;cursor:zoom-out}
@media (orientation:landscape){.zbox canvas{width:auto;height:100%;max-height:calc(100vh - 60px)}.zbox.big canvas{height:auto;width:260%;max-height:none}}
.pack{background-size:cover;background-position:center;min-height:110px}
.th img{aspect-ratio:16/10}
.zoomov{background:#000}
/* v4 */
.small{font-size:14px}.pl .s{font-size:12.5px}.th div{font-size:13.5px}.pack .cnt{font-size:13px}.mini{font-size:12.5px}
.build ul{font-size:13.5px}.zhint{font-size:12px}.item-card .no{font-size:14px}.lead{font-size:15px}
.warn{margin-bottom:10px !important;background:#3d2a07;border:1px solid #ffb347;color:#ffd79a;border-radius:12px;padding:8px 10px;margin:8px 0 0;font-size:14px;font-weight:700;line-height:1.35}
.minihd{font-size:13px;color:var(--mut);margin-top:10px}
.handoff{text-align:center;padding-top:40px}.handoff h1 b{color:var(--acc)}
.net .nc{opacity:.7;font-weight:600;margin-left:2px}
canvas.scene{background:#2a2145}
#netbar{font-size:15px;line-height:1.4}

function loadImg(blob){ return new Promise(res=>{ const u=URL.createObjectURL(blob); const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=u; }); }
async function loadSet(e){

async function loadList(f,list){ // own per-item art; null entries fall back to the shared pool

  const start=Math.min(...ps.map(p=>p[0])), end=Math.max(...ps.map(p=>p[0]+p[1]));

function hueCanvas(im,deg){ // rotate hue of a sprite (works everywhere, no ctx.filter)

function peopleMap(th){ // stable item -> {c: character 0..14, hue}

function ensure(th){

   Every message is fanned out to several Nostr relays (ephemeral events, wss:443) and public MQTT brokers (wss);
   receivers de-duplicate. Host-authoritative: guests send actions, host broadcasts state. */
window.NET=(function(){
const NOSTR=['wss://nos.lol','wss://relay.primal.net','wss://relay.snort.social','wss://nostr.mom','wss://offchain.pub','wss://relay.damus.io'];
const MQTT=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const APP='tw20v4', KIND=25050, ABC='ABCDEFGHJKMNPQRSTUVWXYZ';
const now=()=>Date.now(), rid=()=>Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
const newCode=()=>Array.from({length:4},()=>ABC[Math.floor(Math.random()*ABC.length)]).join('');
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));

let SK=null, PK=null;
function keys(){ if (!SK){ SK=NobleSecp.utils.randomSecretKey(); PK=hex(NobleSecp.schnorr.getPublicKey(SK)); } }
async function nostrEvent(tag, content){ keys();
  const e={pubkey:PK, created_at:Math.floor(now()/1000), kind:KIND, tags:[['t',tag]], content};
  const id=hex(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(JSON.stringify([0,e.pubkey,e.created_at,e.kind,e.tags,e.content])))));
  e.id=id; e.sig=hex(await NobleSecp.schnorr.signAsync(unhex(id), SK)); return e; }
function NostrEP(url, bus){
  const ep={url, kind:'nostr', open:false, ws:null, fails:0, timer:null};
  ep.connect=()=>{ if (bus.closed) return; clearTimeout(ep.timer); try{ ep.ws&&ep.ws.close(); }catch(e){}
    let ws; try{ ws=new WebSocket(url); }catch(e){ return ep.retry(); } ep.ws=ws;
    const to=setTimeout(()=>{ if (!ep.open) try{ ws.close(); }catch(e){} },9000);
    ws.onopen=()=>{ clearTimeout(to); ep.open=true; ep.fails=0; ws.send(JSON.stringify(['REQ','s'+bus.id,{kinds:[KIND],'#t':[bus.tag],since:Math.floor(now()/1000)-30}])); bus.changed(); };
    ws.onmessage=ev=>{ let d; try{ d=JSON.parse(ev.data); }catch(e){ return; }

    ws.onerror=()=>{};

  return ep;
}
/* ---------- endpoint: MQTT 3.1.1 over WebSocket (QoS 0, minimal) ---------- */
function vlen(n){ const o=[]; do{ let b=n%128; n=Math.floor(n/128); if (n>0) b|=128; o.push(b); }while(n>0); return o; }
function mstr(s){ const b=enc.encode(s); return [b.length>>8,b.length&255,...b]; }
function pkt(type, body){ const b=body instanceof Uint8Array?Array.from(body):body; return new Uint8Array([type,...vlen(b.length),...b]); }
function MqttEP(url, bus){
  const ep={url, kind:'mqtt', open:false, ws:null, fails:0, timer:null, ping:null, buf:new Uint8Array(0)};
  ep.connect=()=>{ if (bus.closed) return; clearTimeout(ep.timer); clearInterval(ep.ping); try{ ep.ws&&ep.ws.close(); }catch(e){}
    let ws; try{ ws=new WebSocket(url,['mqtt']); }catch(e){ return ep.retry(); } ws.binaryType='arraybuffer'; ep.ws=ws; ep.buf=new Uint8Array(0);
    const to=setTimeout(()=>{ if (!ep.open) try{ ws.close(); }catch(e){} },9000);
    ws.onopen=()=>{ ws.send(pkt(0x10,[...mstr('MQTT'),4,0x02,0,30,...mstr(APP+'-'+rid())])); };
    ws.onmessage=ev=>{ const d=new Uint8Array(ev.data); const nb=new Uint8Array(ep.buf.length+d.length); nb.set(ep.buf); nb.set(d,ep.buf.length); ep.buf=nb;
      for(;;){ const b=ep.buf; if (b.length<2) break; let mul=1, len=0, i=1, c;
        do{ if (i>=b.length) return; c=b[i++]; len+=(c&127)*mul; mul*=128; }while(c&128);
        if (b.length<i+len) return; const type=b[0]>>4, flags=b[0]&15, body=b.subarray(i,i+len); ep.buf=b.slice(i+len);
        if (type===2){ clearTimeout(to); ep.open=true; ep.fails=0; ws.send(pkt(0x82,[0,1,...mstr(bus.mtopic),0])); clearInterval(ep.ping); ep.ping=setInterval(()=>{ try{ ws.send(new Uint8Array([0xC0,0])); }catch(e){} },20000); bus.changed(); }
        else if (type===3){ const tl=(body[0]<<8)|body[1]; let p=2+tl; if ((flags>>1)&3) p+=2; bus.recv(dec.decode(body.subarray(p))); } } };
    ws.onclose=()=>{ clearTimeout(to); clearInterval(ep.ping); if (ep.ws!==ws) return; const was=ep.open; ep.open=false; if (was) bus.changed(); ep.retry(); };
    ws.onerror=()=>{};
  };

  ep.send=str=>{ if (ep.open && ep.ws.readyState===1) try{ ep.ws.send(pkt(0x30,[...mstr(bus.mtopic),...enc.encode(str)])); }catch(e){} };

}
/* ---------- bus: fan-out + de-dup ---------- */
function Bus(code, cid, onMsg, onChange){
  const me=rid();
  const bus={id:rid(), tag:APP+'-'+code.toLowerCase(), mtopic:APP+'/'+code, me, cid, closed:false, seen:new Map(), eps:[]};
  bus.changed=()=>onChange&&onChange(bus.count());
  bus.count=()=>bus.eps.filter(e=>e.open).length;
  bus.recv=str=>{ let m; try{ m=JSON.parse(str); }catch(e){ return; } if (!m||!m._m||m._f===me||bus.seen.has(m._m)) return;
    bus.seen.set(m._m, now()); if (bus.seen.size>600){ for (const [k] of bus.seen){ bus.seen.delete(k); if (bus.seen.size<400) break; } }
    if (m._to && m._to!==cid) return; onMsg(m); };
  bus.publish=async m=>{ const str=JSON.stringify({...m,_m:rid(),_f:me}); bus.eps.filter(e=>e.kind==='mqtt').forEach(e=>e.send(str));
    const ns=bus.eps.filter(e=>e.kind==='nostr'&&e.open); if (ns.length){ try{ const ev=await nostrEvent(bus.tag,str); ns.forEach(e=>e.send(ev)); }catch(e){} } };
  bus.kick=()=>bus.eps.forEach(e=>{ if (!e.open){ e.fails=0; e.connect(); } });
  bus.close=()=>{ bus.closed=true; bus.eps.forEach(e=>e.close()); };
  const list=(window.__RELAYS||{nostr:NOSTR,mqtt:MQTT});
  if (typeof NobleSecp!=='undefined' && window.crypto && crypto.subtle) list.nostr.forEach(u=>bus.eps.push(NostrEP(u,bus)));
  list.mqtt.forEach(u=>bus.eps.push(MqttEP(u,bus)));
  bus.eps.forEach(e=>e.connect());
  return bus;
}
function waitOpen(bus, ms){ return new Promise((res,rej)=>{ const t0=now(); const iv=setInterval(()=>{ if (bus.closed){ clearInterval(iv); rej(new Error('closed')); } else if (bus.count()>0){ clearInterval(iv); res(); } else if (now()-t0>ms){ clearInterval(iv); rej(new Error('Sunuculara bağlanılamadı. İnternet bağlantını kontrol edip "Tekrar dene"ye dokun.')); } },150); }); }
/* ---------- session ---------- */
const N={role:null, code:null, bus:null, h:{}, timers:[], peers:new Map(), lastHost:0, relays:0, cid:null};
function clearTimers(){ N.timers.forEach(clearInterval); N.timers=[]; }
function stop(){ clearTimers(); if (N.bus) N.bus.close(); N.bus=null; N.peers.clear(); N.role=null; }
function status(s){ N.h.onStatus&&N.h.onStatus(s, N.relays); }
/* host: pid = guest cid */
async function host(code, handlers, myCid){
  stop(); N.role='host'; N.h=handlers; code=code||newCode(); N.code=code; N.cid=myCid||rid();
  N.bus=Bus(code, N.cid, m=>{
    if (m.t==='hb'||m.t==='hello'||m.t==='act'||m.t==='sync'){ if (!m.cid) return; const fresh=!N.peers.has(m.cid); N.peers.set(m.cid,now());
      if (m.t==='hb'){ if (fresh) N.h.onMsg&&N.h.onMsg(m.cid,{t:'sync'}); return; }
      N.h.onMsg&&N.h.onMsg(m.cid,m); } }, n=>{ N.relays=n; status(n>0?'ok':'lost'); });
  await waitOpen(N.bus, 15000);
  N.timers.push(setInterval(()=>{ N.bus.publish({t:'hb', v:N.h.version?N.h.version():0});
    for (const [cid,t] of N.peers) if (now()-t>16000){ N.peers.delete(cid); N.h.onLeave&&N.h.onLeave(cid); } },4000));
  return code;
}
function sendTo(cid,m){ if (N.bus) N.bus.publish({...m,_to:cid}); }
function broadcast(m){ if (N.bus) N.bus.publish(m); }
/* client */
function join(code, hello, handlers){
  stop(); N.role='client'; N.h=handlers; N.code=code=code.toUpperCase(); N.cid=hello.cid; let welcomed=false;
  return new Promise(async (resolve,reject)=>{
    N.bus=Bus(code, hello.cid, m=>{
      if (m.cid) return; N.lastHost=now();
      if (m.t==='welcome'){ if (!welcomed){ welcomed=true; resolve(); } status('ok'); }
      if (m.t==='reject' && !welcomed){ welcomed=true; reject(new Error(m.msg)); stop(); return; }
      if (m.t==='hb'){ if (N.h.version && m.v>N.h.version()) N.bus.publish({t:'sync',cid:N.cid}); if (welcomed) status('ok'); return; }
      N.h.onMsg&&N.h.onMsg(m); }, n=>{ N.relays=n; if (welcomed) status(n>0?(now()-N.lastHost<15000?'ok':'lost'):'lost'); });
    try{ await waitOpen(N.bus, 15000); }catch(e){ stop(); reject(e); return; }
    const t0=now(); N.bus.publish({t:'hello',...hello});
    const iv=setInterval(()=>{ if (welcomed){ clearInterval(iv); return; } if (!N.bus){ clearInterval(iv); return; }
      if (now()-t0>14000){ clearInterval(iv); stop(); reject(new Error('Bu kodla açık bir lobi bulunamadı. Kodu kontrol et; ev sahibinin oyunu açık tuttuğundan emin olun.')); return; }
      N.bus.publish({t:'hello',...hello}); },2000);
    N.timers.push(setInterval(()=>{ if (!welcomed||!N.bus) return; N.bus.publish({t:'hb',cid:N.cid});
      const gap=now()-N.lastHost; if (gap>12000){ status(gap>45000?'dead':'lost'); N.bus.publish({t:'hello',...hello}); } },4000));
  });
}
function send(m){ if (!N.bus||N.bus.count()===0) return false; N.bus.publish({...m,cid:N.cid}); return true; }
function retry(){ if (N.bus){ N.bus.kick(); if (N.role==='client') N.lastHost=Math.max(N.lastHost, now()-11000); } }
return { host, join, stop, send, sendTo, broadcast, retry, N, newCode, available:()=>typeof WebSocket!=='undefined' };
})();
</script><script>'use strict';
const T = window.THEMES;
const TH = id => T.find(t=>t.id===id);
const CATS = {
  food:{n:'Yemek',e:'🍕'}, life:{n:'Hayat',e:'🏝️'}, cars:{n:'Arabalar',e:'🚗'}, fandom:{n:'Fandom',e:'🦸'}, sports:{n:'Spor & Oyun',e:'⚽'},
  fantasy:{n:'Fantastik',e:'🐉'}, party:{n:'Parti',e:'🎉'}, naughty:{n:'Açık Saçık (+18)',e:'🔥'}
};
const $ = s => document.querySelector(s);
const app = () => $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('tw20_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('tw20_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('tw20_'+k); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
function toast(msg, ms=1800){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), ms); }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function overlay(html, cls){ const o=document.createElement('div'); o.className='overlay '+(cls||''); o.innerHTML=html; document.body.appendChild(o); return o; }
function closeOverlays(){ document.querySelectorAll('.overlay.st').forEach(o=>o.remove()); }
let CID = LS.get('cid', null); if (!CID){ CID=Math.random().toString(36).slice(2,10); LS.set('cid',CID); }

/* ======================= state ======================= */
let G = null;            // shared game state (host-authoritative when online)
const U = { screen:'home', pack:null, me:-1, online:false, isHost:false, status:'ok', amt:1, amtKey:'', animSeq:-1, noteSeq:0, joinCode:'', err:'', busy:false };
const defaults = () => ({ budget:LS.get('budget',20), perTheme:LS.get('perTheme',10), target:LS.get('target',3), adult:LS.get('adult',false) });
function newPlayer(name,cid){ return {name, cid:cid||null, on:true, score:0, money:0, items:[], paid:{}}; }
function newGame(mode, names, set){
  return { mode, seq:1, set, players:names.map(n=>newPlayer(n)), phase:mode==='online'?'lobby':'pick', used:LS.get('used',[]), round:0,
           tid:null, pool:null, queue:[], k:0, a:null, flash:null, cl:-1, last:-1, champ:-1, spun:false, note:'', noteSeq:0, hist:[] };
}
function themesFor(set){ return T.filter(t => set.adult || t.cat!=='naughty'); }
function chooseItems(th, per){
  const idx = th.items.map((_,i)=>i); const n = Math.min(per, idx.length);
  if (th.roles && th.slots){
    const ess = shuffle(idx.filter(i=>th.roles[i]==='essential'));
    const need = Math.min(n-2, Object.values(th.slots).reduce((a,b)=>a+b,0)+2, ess.length);
    const pick = ess.slice(0, need); const rest = shuffle(idx.filter(i=>!pick.includes(i)));
    return shuffle(pick.concat(rest.slice(0, n-pick.length)));
  }
  return shuffle(idx).slice(0,n);
}
function note(G,msg){ G.note=msg; G.noteSeq++; }
function startTheme(G, id, spun, pool){
  const th=TH(id); G.tid=id; G.endMsg=''; if (!G.used.includes(id)) G.used.push(id);
  G.queue=chooseItems(th, G.set.perTheme); G.k=0; G.spun=!!spun; G.pool=pool||null;
  G.players.forEach(p=>{ p.money=G.set.budget; p.items=[]; p.paid={}; }); G.phase='intro';
}
function spinPick(G, cat){
  const pool=themesFor(G.set).filter(t=>!cat||t.cat===cat); let fresh=pool.filter(t=>!G.used.includes(t.id)&&t.id!==G.tid); if (!fresh.length) fresh=pool;
  return fresh[Math.floor(Math.random()*fresh.length)].id;
}
function nextItem(G){
  if (G.k >= G.queue.length){ G.phase='results'; return; }
  const rich=G.players.map((p,i)=>i).filter(i=>G.players[i].money>0);
  if (!rich.length){ const left=G.queue.length-G.k; G.k=G.queue.length; G.endMsg='💸 Yetersiz bütçe: kimsenin parası kalmadı, kalan '+left+' eşya satılmadı.'; note(G,'Yetersiz bütçe: kimsenin parası kalmadı'); G.phase='results'; return; }
  if (rich.length===1 && G.players.length>1){ G.phase='clearance'; G.cl=rich[0]; return; }
  const n=G.players.length; let op=G.k%n; while (G.players[op].money<=0) op=(op+1)%n;
  G.a={bid:0, leader:-1, passed:G.players.map((p,i)=>i).filter(i=>G.players[i].money<=0), turn:op};
  G.phase='auction';
}
function nextTurn(G){
  const a=G.a, n=G.players.length;
  const can=i=>!a.passed.includes(i) && G.players[i].money>a.bid && i!==a.leader;
  const cs=G.players.map((p,i)=>i).filter(can);
  a.broke=G.players.map((p,i)=>i).filter(i=>i!==a.leader && G.players[i].money>0 && G.players[i].money<=a.bid);
  if (a.leader>=0 && !cs.length){ const i=G.queue[G.k], p=G.players[a.leader]; p.money-=a.bid; p.items.push(i); p.paid[i]=a.bid; G.flash={i,w:a.leader,price:a.bid,broke:a.broke}; G.phase='flash'; return; }
  if (a.leader<0 && !cs.length){ G.flash={i:G.queue[G.k], w:-1}; G.phase='flash'; return; }
  let t=a.turn; for (let s=0;s<n;s++){ t=(t+1)%n; if (can(t)) break; } a.turn=t;
}
/* by = acting player index (online) or -1 (pass-and-play: anyone may act). Returns true if the state changed. */
function reduce(G, a, by){
  const any = by<0, ph=G.phase, host = any || by===0;
  switch (a.t){
    case 'set': if (!host || (ph!=='lobby' && ph!=='pick')) return false; if (!['budget','perTheme','target','adult'].includes(a.k)) return false; G.set[a.k]=a.v; break;
    case 'start': if (ph!=='lobby' || !host || G.players.filter(p=>p.on).length<2) return false;
      G.players=G.players.filter(p=>p.on); G.players.forEach(p=>{p.score=0;}); G.round=0; G.phase='pick'; break;
    case 'pick': if (ph!=='pick' || !TH(a.id)) return false; startTheme(G,a.id,false,null); break;
    case 'spin': if (ph!=='pick' && !(ph==='intro')) return false; { const cat=a.cat||null; if (ph==='intro'){ G.used=G.used.filter(x=>x!==G.tid); } startTheme(G, spinPick(G,cat), true, cat); } break;
    case 'back': if (ph!=='intro') return false; G.used=G.used.filter(x=>x!==G.tid); G.phase='pick'; break;
    case 'begin': if (ph!=='intro') return false; nextItem(G); break;
    case 'bid': { if (ph!=='auction') return false; const t=G.a.turn, p=G.players[t];
      if (!(any||by===t)) return false; const v=Math.floor(+a.amt); if (!(v>G.a.bid && v<=p.money)) return false;
      G.a.bid=v; G.a.leader=t; nextTurn(G); break; }
    case 'pass': { if (ph!=='auction') return false; const t=G.a.turn;
      if (!(any||by===t||(a.force && !G.players[t].on))) return false; G.a.passed.push(t); nextTurn(G); break; }
    case 'next': if (ph!=='flash') return false; G.k++; nextItem(G); break;
    case 'take': case 'leave': { if (ph!=='clearance') return false; if (!(any||by===G.cl||(a.force&&!G.players[G.cl].on))) return false;
      if (a.t==='take'){ const p=G.players[G.cl], i=G.queue[G.k]; p.money-=1; p.items.push(i); p.paid[i]=1; note(G, p.name+' aldı: '+TH(G.tid).items[i]); }
      G.k++; nextItem(G); break; }
    case 'award': { if (ph!=='results') return false; const w=+a.w; if (w>=0 && !G.players[w]) return false;
      if (w>=0) G.players[w].score++; G.round++; G.last=w; G.hist.push({tid:G.tid,w});
      const champ=G.players.findIndex(p=>p.score>=G.set.target); if (champ>=0){ G.champ=champ; G.phase='final'; } else G.phase='award'; break; }
    case 'nextTheme': if (ph!=='award') return false; G.phase='pick'; break;
    case 'rematch': if (ph!=='final') return false; G.players.forEach(p=>p.score=0); G.round=0; G.champ=-1; G.phase='pick'; break;
    case 'toLobby': if (!host || G.mode!=='online') return false; G.players.forEach(p=>{p.score=0;}); G.round=0; G.phase='lobby'; break;
    case 'resetUsed': G.used=[]; note(G,'Oynanan temalar sıfırlandı'); break;
    default: return false;
  }
  G.seq++; return true;
}
function act(a){
  if (!G) return;
  if (!U.online || U.isHost){ if (reduce(G, a, U.online?0:-1)) commit(); }
  else { a.s=G.seq; a.n=Math.random().toString(36).slice(2,10); U.pend={a, s:G.seq, n:0}; if (!NET.send({t:'act', a})) toast('Bağlantı yok, yeniden bağlanılıyor…'); }
}
setInterval(()=>{ const p=U.pend; if (!p||!U.online||U.isHost||!G) return; if (G.seq!==p.s || p.n>=8){ U.pend=null; return; } p.n++; NET.send({t:'act', a:p.a}); }, 2500);
function commit(){
  if (U.online && U.isHost){ NET.broadcast({t:'state', G}); LS.set('host', {code:NET.N.code, G, at:Date.now()}); }
  if (!U.online){ LS.set('used', G.used); LS.set('local', {G, at:Date.now()}); }
  if (U.online && !U.isHost) {} 
  render();
}

/* ======================= online glue ======================= */
const PEERS = {}; // host: peerId -> player index
const DONE = {}; // host: cid -> recently applied action nonces
function hostHandlers(){ return {
  onMsg(pid, m){
    if (!m || !G) return;
    if (m.t==='hello'){
      const name=String(m.name||'Oyuncu').slice(0,14).trim()||'Oyuncu';
      let idx=G.players.findIndex(p=>p.cid && p.cid===m.cid);
      if (idx<0){
        if (G.phase!=='lobby'){ NET.sendTo(pid,{t:'reject', msg:'Bu oyun çoktan başladı. Ev sahibi "Lobiye dön" derse katılabilirsin.'}); return; }
        if (G.players.length>=6){ NET.sendTo(pid,{t:'reject', msg:'Lobi dolu (en fazla 6 oyuncu).'}); return; }
        let nm=name, k=2; while (G.players.some(p=>p.name.toLowerCase()===nm.toLowerCase())) nm=name.slice(0,12)+' '+(k++);
        G.players.push(newPlayer(nm, m.cid)); idx=G.players.length-1; note(G, nm+' lobiye katıldı');
      } else { G.players[idx].on=true; note(G, G.players[idx].name+' bağlandı'); }
      for (const k in PEERS) if (PEERS[k]===idx && k!==pid) delete PEERS[k];
      PEERS[pid]=idx; G.seq++; NET.sendTo(pid,{t:'welcome', me:idx, code:NET.N.code}); commit(); return;
    }
    if (m.t==='sync'){ let idx=PEERS[pid]; if (idx==null){ idx=G.players.findIndex(p=>p.cid===pid); if (idx<0) return; PEERS[pid]=idx; NET.sendTo(pid,{t:'welcome', me:idx, code:NET.N.code}); }
      if (G.players[idx] && !G.players[idx].on){ G.players[idx].on=true; note(G, G.players[idx].name+' bağlandı'); G.seq++; commit(); } else NET.sendTo(pid,{t:'state', G}); return; }
    if (m.t==='act'){
      const by=PEERS[pid]; if (by==null) return;
      const n=m.a.n; DONE[pid]=DONE[pid]||[]; if (n && DONE[pid].includes(n)){ NET.sendTo(pid,{t:'state', G}); return; }
      if (!n && m.a.s!==G.seq){ NET.sendTo(pid,{t:'state', G}); return; }
      if (n){ DONE[pid].push(n); if (DONE[pid].length>40) DONE[pid].shift(); }
      if (reduce(G, m.a, by)) commit(); else NET.sendTo(pid,{t:'state', G});
    }
  },
  onLeave(pid){ const idx=PEERS[pid]; delete PEERS[pid]; if (idx==null || !G || !G.players[idx]) return;
    if (G.phase==='lobby' && idx>0){ G.players.splice(idx,1); for (const k in PEERS) if (PEERS[k]>idx) PEERS[k]--; note(G,'Bir oyuncu lobiden ayrıldı'); }
    else { G.players[idx].on=false; note(G, G.players[idx].name+' bağlantısı koptu'); }
    G.seq++; commit(); },
  onError(msg){ U.status='lost'; toast(msg, 4000); },
  onStatus(s){ U.status=s; statusBanner(); },
  version(){ return G?G.seq:0; }
}; }
function clientHandlers(){ return {
  onMsg(m){
    if (m.t==='welcome'){ U.me=m.me; return; }
    if (m.t==='state'){ if (G && m.G.seq<G.seq && G.phase!=='lobby') return; G=m.G; U.online=true; U.isHost=false; U.busy=false; const mi=G.players.findIndex(p=>p.cid===CID); if (mi>=0) U.me=mi; U.status='ok'; render(); return; }
    if (m.t==='reject'){ NET.stop(); U.online=false; G=null; LS.del('join'); U.screen='online'; U.err=m.msg; history.replaceState(null,'',location.pathname); render(); }
  },
  onStatus(s){ U.status=s; statusBanner(); },
  onError(msg){ toast(msg, 4000); },
  version(){ return G?G.seq:0; }
}; }
async function hostGame(resume){
  if (!NET.available()){ U.err='Bu tarayıcı online oyunu desteklemiyor.'; render(); return; }
  U.busy=true; U.err=''; U.lastTry=()=>hostGame(resume); render();
  try{
    const saved=resume?LS.get('host',null):null;
    const code=await NET.host(saved?saved.code:null, hostHandlers(), CID);
    U.online=true; U.isHost=true; U.me=0; U.status='ok';
    if (saved){ G=saved.G; G.players.forEach((p,i)=>p.on=i===0); }
    else { const name=(LS.get('nick','')||'Ev sahibi'); G=newGame('online',[name],defaults()); G.players[0].cid=CID; }
    U.busy=false; commit();
  }catch(e){ U.busy=false; U.err=e.message||String(e); render(); }
}
async function joinGame(code){
  code=(code||'').toUpperCase().replace(/[^A-Z]/g,'');
  if (code.length!==4){ U.err='Kod 4 harf olmalı.'; render(); return; }

  U.busy=true; U.err=''; U.joinCode=code; U.lastTry=()=>joinGame(code); render();
  try{
    await NET.join(code, {name, cid:CID}, clientHandlers());
    U.online=true; U.isHost=false; U.status='ok'; LS.set('join',{code, at:Date.now()});
    if (location.hash!=='#j='+code) history.replaceState(null,'','#j='+code);

}

  if (anim){ const sp=$('#sp'), pool=themesFor(G.set); let n=0; const final=sp.innerHTML; bg.dataset.spin='1'; bg.disabled=true;
    const tick=()=>{ n++; if (n>=14){ sp.innerHTML=final; delete bg.dataset.spin; if (ready) bg.disabled=false; vibrate(30); return; }
      const t=pool[Math.floor(Math.random()*pool.length)]; sp.innerHTML=`<div class="mut">Tema çevriliyor…</div><h2 style="font-size:24px;margin:6px 0">${CATS[t.cat].e} ${esc(t.title)}</h2>`; setTimeout(tick,40+n*n*1.5); };
    tick(); }
}
function playersBar(a){
  return `<div class="players">${G.players.map((q,j)=>`<div class="pl ${a&&j===a.turn?'turn':''} ${(a&&a.passed.includes(j))||q.money<=0?'out':''} ${q.on?'':'off'}"><div class="n">${esc(q.name)}${a&&j===a.leader?' 👑':''}${U.online&&j===U.me?' (sen)':''}${q.on?'':' 🔴'}</div><div class="m">$${q.money}</div><div class="s">${q.items.length} eşya${q.money<=0?' · 💸 para bitti':a&&a.broke&&a.broke.includes(j)?' · 💸 bütçe yetmiyor':a&&a.passed.includes(j)?' · pas':''}</div></div>`).join('')}</div>`;
}
function auction(){
  const th=TH(G.tid), i=G.queue[G.k], a=G.a, p=G.players[a.turn], maxBid=p.money;
  const key=G.k+':'+a.bid+':'+a.turn; if (U.amtKey!==key){ U.amtKey=key; U.amt=a.bid+1; }
  U.amt=Math.max(a.bid+1, Math.min(U.amt, maxBid));
  const mine=canAct(a.turn);
  app().innerHTML=`${topbar(esc(th.theme),'<button class="icon" id="tbPeek">👀 Yapılar</button>')}
  ${playersBar(a)}
  <div class="item-card"><div class="no">Eşya ${G.k+1} / ${G.queue.length}</div>
    <div class="art" id="art"></div><div class="nm">${esc(th.items[i])}</div>
    <div style="margin-top:10px" class="bid">$${a.bid}</div><div class="lead">${a.leader>=0?esc(G.players[a.leader].name)+' önde':'Henüz teklif yok, en az $1'}</div>
    ${brokeMsg(a.broke, a.bid)}</div>
  ${mine?`<div class="turnbox"><div class="who">Sıra: <b>${esc(p.name)}</b>${U.online?' (sen)':''}</div>
    <div class="amount"><button id="minus">−</button><div class="v">$${U.amt}</div><button id="plus">+</button></div>
    <div class="steps"><button data-d="1">+1</button><button data-d="2">+2</button><button data-d="5">+5</button><button id="allin" class="btn-bad">ALL IN</button></div>
    <div class="row"><button id="pass">Pas</button><button class="btn-acc" id="bid">$${U.amt} teklif ver</button></div></div>`
  :`<div class="turnbox"><div class="who">Sıra: <b>${esc(p.name)}</b></div><p class="mut" style="text-align:center;margin:0">${p.on?'Teklifini bekliyoruz… ⏳':'Bu oyuncunun bağlantısı koptu.'}</p>
    ${p.on?'':'<button class="full" id="fpass" style="margin-top:8px">⏭️ Onun yerine pas geç</button>'}</div>`}
  <div class="minis" id="minis"></div>`;
  $('#art').appendChild(SCENE.itemArt(th,i));
  if (mine){
    const setAmt=v=>{ U.amt=Math.max(a.bid+1,Math.min(maxBid,v)); auction(); bindTop(); };
    $('#minus').onclick=()=>setAmt(U.amt-1); $('#plus').onclick=()=>setAmt(U.amt+1);
    app().querySelectorAll('.steps [data-d]').forEach(b=>b.onclick=()=>setAmt(a.bid+ +b.dataset.d));
    $('#allin').onclick=()=>setAmt(maxBid);
    $('#pass').onclick=()=>act({t:'pass'});
    $('#bid').onclick=()=>{ vibrate(15); act({t:'bid', amt:U.amt}); };
  } else { const f=$('#fpass'); if (f) f.onclick=()=>act({t:'pass', force:true}); }
  drawMinis();
}
function brokeMsg(list, bid){ if (!list||!list.length) return '';
  return `<div class="warn">💸 Yetersiz bütçe: ${list.map(j=>esc(G.players[j].name)+' ($'+G.players[j].money+')').join(', ')} $${bid+1} veya üstünü veremez, sırası atlanır.</div>`; }
function drawMinis(){
  const box=$('#minis'); if (!box) return; const th=TH(G.tid);
  if (G.players.some(p=>p.items.length)){ const h=document.createElement('div'); h.className='minihd'; h.textContent='Şu ana kadarki yapılar (büyütmek için dokun):'; box.before(h); }
  G.players.forEach(p=>{ if (!p.items.length) return; const d=document.createElement('div'); d.className='mini';
    const cv=document.createElement('canvas'); cv.className='scene'; d.appendChild(cv); d.appendChild(document.createTextNode(p.name)); box.appendChild(d);
    cv.onclick=()=>zoom(th, p.items, p.name); SCENE.renderScene(cv, th, p.items); });
}
function flash(){
  const th=TH(G.tid), f=G.flash;
  app().innerHTML=`${topbar(esc(th.theme),'<button class="icon" id="tbPeek">👀 Yapılar</button>')}${playersBar(null)}
  <div class="item-card"><div class="art" id="fart"></div>
  <h2>${f.w>=0?'🔨 '+esc(th.items[f.i]):esc(th.items[f.i])}</h2>
  <p class="mut" style="font-size:17px">${f.w>=0?`Satıldı → <b style="color:var(--acc2)">${esc(G.players[f.w].name)}</b> · $${f.price}`:'Kimse teklif vermedi, satılmadı'}</p>
  ${f.w>=0&&f.broke&&f.broke.length?`<div class="warn">💸 Yetersiz bütçe: ${f.broke.map(j=>esc(G.players[j].name)+' ($'+G.players[j].money+')').join(', ')} bu fiyatı geçemedi.</div>`:''}
  <button class="btn-acc full" id="nx" style="font-size:18px">Sıradaki eşya</button></div><div class="minis" id="minis"></div>`;

  $('#nx').onclick=()=>act({t:'next'});
  drawMinis();
}
function clearance(){
  const th=TH(G.tid), i=G.queue[G.k], p=G.players[G.cl], mine=canAct(G.cl);
  app().innerHTML=`${topbar('🏷️ Kapanış indirimi','<button class="icon" id="tbPeek">👀 Yapılar</button>')}
  <p class="mut small" style="text-align:center">Parası kalan tek oyuncu: <b>${esc(p.name)}</b> ($${p.money}). Kalan eşyalar 1 dolara teklif ediliyor.</p>
  <div class="item-card"><div class="no">Eşya ${G.k+1} / ${G.queue.length}</div><div class="art" id="art"></div><div class="nm">${esc(th.items[i])}</div></div>
  ${mine?`<div class="row"><button id="leave">Bırak<br><small style="font-weight:500">almadan geç</small></button><button class="btn-acc" id="take">Al · $1<br><small style="font-weight:500">yapına ekle</small></button></div>
  <p class="mut small" style="text-align:center">Al: $1 ödersin, eşya yapına girer. Bırak: eşya kimseye satılmadan geçilir.</p>`
   :`<p class="mut" style="text-align:center">${esc(p.name)} karar veriyor… ⏳</p>${p.on?'':'<button class="full" id="fl">⏭️ Bağlantısı koptu, bırak</button>'}`}
  <div class="minis" id="minis"></div>`;
  $('#art').appendChild(SCENE.itemArt(th,i));
  if (mine){ $('#leave').onclick=()=>act({t:'leave'}); $('#take').onclick=()=>act({t:'take'}); }
  else { const f=$('#fl'); if (f) f.onclick=()=>act({t:'leave', force:true}); }
  drawMinis();
}
function buildsHTML(withAward){
  return `<div class="builds ${G.players.length===1?'one':''}">${G.players.map((p,j)=>`<div class="build" data-j="${j}">
    <canvas class="scene zoomable" id="b${j}" title="Büyütmek için dokun"></canvas><div class="zhint">🔍 büyüt</div><div class="n">${esc(p.name)}</div>
    <div class="small mut">${p.items.length} eşya · $${p.money} kaldı</div>
    <ul>${p.items.map(i=>`<li>${esc(TH(G.tid).items[i])} <span style="color:var(--acc2)">$${p.paid[i]}</span></li>`).join('')||'<li>Hiçbir şey almadı 😅</li>'}</ul>
    ${withAward?`<button class="btn-acc full aw" data-j="${j}">🏆 Kazanan bu</button>`:''}</div>`).join('')}</div>`;
}
function drawBuilds(root){ const th=TH(G.tid); G.players.forEach((p,j)=>{ const cv=root.querySelector('#b'+j); SCENE.renderScene(cv, th, p.items); cv.onclick=()=>zoom(th,p.items,p.name); }); }
function peekBuilds(){
  const o=overlay(`<div class="card"><h2>👀 Yapılar</h2><p class="mut small">Büyütmek için bir yapıya dokun.</p>${buildsHTML(false)}<button class="btn-acc full" style="margin-top:10px">Kapat</button></div>`,'st');

}
function results(){
  const th=TH(G.tid);
  app().innerHTML=`${topbar('')}
  <div class="theme-banner"><div class="mut small">${G.endMsg?'Açık artırma bitti':'Tüm eşyalar satıldı!'}</div><div class="t">${esc(th.theme)}</div></div>

  <h2 style="text-align:center">Kim daha iyi yaptı?</h2><p class="mut small" style="text-align:center">Yapıya dokunup büyüt, tartışın, sonra kazananı seçin.</p>
  ${buildsHTML(true)}

  drawBuilds(app());
  app().querySelectorAll('.aw').forEach(b=>b.onclick=()=>act({t:'award', w:+b.dataset.j}));
  $('#tie').onclick=()=>act({t:'award', w:-1});
  $('#save').onclick=saveImage;
}
function award(){
  const w=G.last;
  app().innerHTML=`${topbar('')}<div class="card" style="text-align:center;margin-top:30px"><div style="font-size:56px">${w>=0?'🏆':'🤝'}</div>
   <h2>${w>=0?esc(G.players[w].name)+' bu temayı kazandı!':'Berabere!'}</h2>
   ${G.players.map(p=>`<div class="score"><span>${esc(p.name)}</span><span>${p.score} / ${G.set.target}</span></div>`).join('')}
   <button class="btn-acc full" id="nt" style="margin-top:14px;font-size:18px">Sonraki tema</button>
   <button class="full" id="save" style="margin-top:8px">💾 Son yapıların resmini kaydet</button></div>`;

function final(){
  vibrate([60,60,60,60,200]); const w=G.champ;
  app().innerHTML=`${topbar('')}<div style="text-align:center;padding-top:30px"><div style="font-size:80px">👑</div>
  <h1>${esc(G.players[w].name)} kazandı!</h1><p class="mut">${G.set.target} puana ilk ulaşan o oldu.</p>
  <div class="card">${G.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="score"><span>${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div>
  <div class="row"><button class="btn-acc" id="re">🔁 Rövanş</button><button id="menu">${U.online?'🚪 Çık':'Menü'}</button></div></div>`;
  $('#re').onclick=()=>act({t:'rematch'});
  $('#menu').onclick=()=>{ if (U.online) leaveOnline(); else { G=null; LS.del('local'); U.screen='home'; render(); } };
}
/* ---------- zoom ---------- */
function zoom(th, owned, name){
  const o=overlay(`<div class="zoomwrap"><div class="zbar"><b>${esc(name)}</b><span class="mut small">Dokun: yakınlaştır / uzaklaştır</span><button class="icon" id="zx">✕</button></div>
    <div class="zbox"><canvas class="zc"></canvas></div></div>`,'st zoomov');
  const cv=o.querySelector('canvas'); SCENE.renderScene(cv, th, owned);
  const box=o.querySelector('.zbox');
  cv.onclick=e=>{ const r=cv.getBoundingClientRect(); const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
    box.classList.toggle('big'); if (box.classList.contains('big')){ requestAnimationFrame(()=>{ box.scrollLeft=fx*box.scrollWidth-box.clientWidth/2; box.scrollTop=fy*box.scrollHeight-box.clientHeight/2; }); } };
  o.querySelector('#zx').onclick=()=>o.remove();
  o.onclick=e=>{ if (e.target===o) o.remove(); };
}
async function saveImage(){
  const th=TH(G.tid), n=G.players.length, cols=Math.min(n,2), rows=Math.ceil(n/cols), CW=768, CH=432, pad=20, head=110;
  const cv=document.createElement('canvas'); cv.width=cols*CW+(cols+1)*pad; cv.height=head+rows*(CH+70)+pad;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#120d1f'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#ff8a1f'; ctx.font='bold 40px system-ui'; ctx.textAlign='center'; ctx.fillText('20$ Challenge', cv.width/2, 50);
  ctx.fillStyle='#fff'; ctx.font='28px system-ui'; ctx.fillText(th.theme, cv.width/2, 90);
  for (let j=0;j<n;j++){ const sc=document.createElement('canvas'); await SCENE.renderScene(sc,th,G.players[j].items);
    const x=pad+(j%cols)*(CW+pad), y=head+Math.floor(j/cols)*(CH+70); ctx.drawImage(sc,x,y,CW,CH);
    ctx.fillStyle='#fff'; ctx.font='bold 30px system-ui'; ctx.fillText(G.players[j].name+'  ($'+G.players[j].money+' kaldı)', x+CW/2, y+CH+42); }
  try{ cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='20-challenge-'+th.id+'.png'; a.click(); toast('Resim kaydedildi'); }); }
  catch(e){ toast('Resim kaydedilemedi'); }
}

  <button class="btn-acc full">Anladım</button></div>`,'');

}
function confirmHome(){

(function boot(){
